<div class="admin-shell">
  <header class="admin-header">
    <span class="admin-kicker">Painel administrativo</span>
    <h1>Gerenciar ideias</h1>
    <p class="admin-subtitle">Atualize o status conforme cada sugestão avança.</p>
  </header>

  <p-message *ngIf="erro" severity="error" [text]="erro" styleClass="w-full mb-3"></p-message>

  <div class="admin-list">
    <div class="admin-row" *ngFor="let ideia of ideias">
      <div class="admin-info">
        <h3>{{ ideia.titulo }}</h3>
        <p>{{ ideia.descricao }}</p>
        <span class="admin-meta"><i class="pi pi-thumbs-up"></i> {{ ideia._count?.votos ?? 0 }} votos</span>
      </div>

      <select
        class="status-select"
        [ngModel]="ideia.status"
        (ngModelChange)="mudarStatus(ideia.id, $event)"
      >
        <option *ngFor="let s of status" [value]="s">{{ s }}</option>
      </select>
    </div>
  </div>
</div>
