<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo combinando com a interface escura -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182232" />
      <stop offset="100%" stop-color="#0F1722" />
    </linearGradient>

    <!-- Gradiente ciano/verde neon idêntico ao botão de UP -->
    <linearGradient id="upGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#52B788" />
    </linearGradient>

    <!-- Brilho suave no ícone -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card do Ícone com Cantos Arredondados -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGradient)" stroke="#2C3B4E" stroke-width="8" />

  <!-- Seta UP / Chevron Minimalista -->
  <g filter="url(#glow)">
    <!-- Seta (Chevron) -->
    <path d="M 130 270 L 256 144 L 382 270" 
          fill="none" 
          stroke="url(#upGradient)" 
          stroke-width="52" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Haste vertical da seta -->
    <line x1="256" y1="170" x2="256" y2="366" 
          stroke="url(#upGradient)" 
          stroke-width="52" 
          stroke-linecap="round" />
  </g>
</svg>
